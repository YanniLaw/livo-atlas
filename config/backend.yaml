ros:
  executor_threads: 4

# Transport subscriber depths for ROS1 and ROS2.
qos:
  lidar_depth: 100
  imu_depth: 2000
  image_depth: 20
  reliability: best_effort  # ROS2 only.

diagnostics:
  stage_timing: false

publish:
  path:
    max_poses: 2000

sensor_buffer:
  # Apply each count limit separately at the ROS handoff and synchronization.
  max_lidar_scans: 64
  max_imu_samples: 4096
  max_images: 32
  # Per queue, measured in corrected sensor time.
  max_span_s: 3.0

keyframes:
  enabled: false
  translation_threshold: 0.5
  rotation_threshold_deg: 10.0
  time_threshold: 2.0

submaps:
  enabled: false
  mode: keyframe_groups
  max_keyframes: 20
  online:
    translation_threshold: 5.0
    rotation_threshold_deg: 45.0
    time_threshold: 20.0
    support_keyframes: 2

loop_closure:
  enabled: false
  search:
    min_submap_gap: 3
    min_keyframe_gap: 50
    min_time_gap_s: 30.0
    search_radius_m: 15.0
    max_candidates: 5
  registration:
    voxel_size_m: 0.5
    min_points: 100
    max_points: 20000
    max_voxels: 100000
    neighbors: 20
    max_iterations: 50
    max_optimizer_iterations: 10
    correspondence_distance_m: 2.0
    translation_epsilon: 0.0001
    rotation_epsilon: 0.0001
    match_distance_m: 0.5
    min_inliers: 100
    min_coverage: 0.3
    max_rmse_m: 0.2
    max_p95_m: 0.3
    max_cycle_translation_m: 0.1
    max_cycle_rotation_deg: 2.0
    max_correction_m: 3.0
    max_correction_deg: 20.0
    min_normal_pairs: 100
    min_eigenvalue_ratio: 0.0001
  admission:
    loop_translation_sigma_m: 0.2
    loop_rotation_sigma_rad: 0.05235987755982989
    max_hypothesis_translation_m: 0.5
    max_hypothesis_rotation_deg: 5.0
    correlated_submap_gap: 2
    max_factor_residual: 3.0
    max_accepted_residual_increase: 0.5
    max_pose_correction_m: 3.0
    max_pose_correction_deg: 20.0
    max_keyframes: 5000
    max_loops: 200
  geometry:
    voxel_size_m: 0.2
    min_points_per_voxel: 6
    max_plane_rms: 0.02
    max_plane_ratio: 0.1
    max_voxels_per_submap: 100000
    max_points_per_keyframe: 1000000
    max_resident_submaps: 3

pose_graph:
  # Defaults to loop_closure.enabled when omitted. Set false for detection only.
  # enabled: false
  # Bounds pending archive writes, including when loop closure is disabled.
  max_pending_keyframes: 64
  prior_rotation_sigma_rad: 0.001
  prior_translation_sigma_m: 0.001
  odometry_rotation_sigma_rad: 0.05
  odometry_translation_sigma_m: 0.1
  max_iterations: 100
  loop_huber_delta: 1.345
