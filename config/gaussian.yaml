gaussian:
  # Frozen training isolation. Online scoring shares the existing worker.
  # Both online and final-snapshot scoring enforce the disk budgets below.
  evaluation:
    enabled: false
    online_enabled: false
    split_file: ""
    max_output_mib: 256
    min_free_disk_mib: 1024
  enabled: false
  persist_submaps: false
  # Use one absolute path for the ROS node and Python worker.
  socket_path: ""
  output_directory: ""
  connect_timeout_ms: 10000
  transfer_timeout_ms: 5000
  job_timeout_ms: 30000
  shutdown_timeout_ms: 3000
  finalize_on_shutdown: false
  finalize_timeout_ms: 60000

  # Joint rendering requires persistent submaps.
  joint_render_enabled: false
  joint_render_policy: temporal
  joint_render_interval_ms: 1000
  joint_render_timeout_ms: 5000
  publish_preview: false
  preview_frame_id: gaussian_camera_optical

  # Python worker settings. Device indices are relative to CUDA_VISIBLE_DEVICES.
  worker:
    seed_policy: uniform  # coverage requires persistent submaps
    # Maximum fraction of the seed budget reserved for uncovered depth pixels.
    # Only affects coverage; 0 uses uniform initialization without a prepass.
    coverage_uncovered_ratio: 0.5
    # replace keeps uniform seed positions except for a bounded hole-filling swap.
    coverage_sampling: resample
    device: cuda:0
    min_free_gpu_memory_mib: 4096
    gpu_memory_fraction: 0.4
    depth_loss_weight: 0.05
    learning_rates:
      means: 0.0005
      log_scales: 0.002
      color_logits: 0.01
      opacity_logits: 0.01
